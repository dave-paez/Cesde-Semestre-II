        <h1>Home</h1>
        <button id="logout">Logout</button>
  
  <section>

        <h2>Crear Usuarios Nuevos</h2>
        <form id="signupForm">
            <label>Nombre</label>
            <input type="text" placeholder="..." id="name" required autofocus>
            <label>Mail</label>
            <input type="email" placeholder="..." id="email" required>
            <label>Contraseña</label>
            <input type="password" placeholder="..." id="password" required>
            <label>rol</label>
            <input type="text" placeholder="..." id="rol" required>
            
            <input type="submit" id="btnGuardar" value="Guardar">
            <input type="button" id="btnActualizar" value="Actualizar">
        </form>
               
  </section>

    <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Correo</th>
      <th scope="col">Contraseña</th>
      <th scope="col">Rol</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
